description = "Revisa el código en cinco ejes y aplica las puertas de calidad del proyecto"

prompt = """
Invoca la skill code-review-and-quality.

Revisa el cambio en los cinco ejes: corrección, legibilidad, arquitectura, seguridad y rendimiento.

Consideraciones específicas de QuickBite:
- Corrección: validación de DTOs, reglas de negocio en Application (no en controladores), manejo de errores con Result, casos límite en estados de pedido (pendiente → confirmado → preparando → listo → en camino → entregado → cancelado).
- Arquitectura: Clean Architecture respetada (Domain no depende de nada, capas externas dependen de internas), sin lógica en controladores, sin dependencias circulares entre proyectos.
- Seguridad: JWT bien configurado, secrets fuera del código, CORS restrictivo, validación de entrada, contraseñas hasheadas con BCrypt.
- Rendimiento: consultas EF Core optimizadas (no N+1), uso de caché donde corresponda, paginación, sin clonar objetos grandes en hot paths.
- Móvil: BLoC emite todos los estados (loading, success, error), repositorios manejan excepciones correctamente, widgets manejan null/empty.

Clasifica cada comentario por severidad (Crítico / Requerido / Opcional / Detalle).

Verifica la historia de verificación del autor:
- `dotnet test` pasa (backend)
- `flutter analyze` limpio (móvil)
- `dotnet build -warnaserror` pasa (si aplica backend)
- La spec en `docs/` coincide con lo implementado
"""
