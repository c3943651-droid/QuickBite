description = "Depura de forma sistemática la causa raíz de un bug o error inesperado"

prompt = """
Invoca la skill debugging-and-error-recovery.

Sigue la regla "detén la línea": deja de añadir funciones, conserva la evidencia y diagnostica con el checklist de triage.

1. REPRODUCE el fallo de forma fiable (dotnet test, flutter test, o comprobación manual con logs)
2. LOCALIZA la capa que falla (compilación, controlador, servicio de aplicación, repositorio, repositorio remoto/local, BLoC/Cubit, widget)
3. REDUCE al caso mínimo que falla
4. ARREGLA la causa raíz, no el síntoma
5. PROTEGE con un test de regresión que falle sin el fix
6. VERIFICA de extremo a extremo

Comandos para backend:
- `dotnet test backend/tests/QuickBite.Tests.Unit/`
- `dotnet build backend/src/QuickBite.sln`
- `dotnet build backend/src/QuickBite.sln -warnaserror`

Comandos para móvil:
- `flutter test` (desde mobile/)
- `flutter analyze`

Patrones de error comunes en .NET: excepciones no capturadas, validación de DTOs, dependencias faltantes en DI, autenticación JWT, EF Core.
Patrones de error comunes en Flutter: estados no emitidos en BLoC, excepciones en repositorios, widgets sin manejar null.
"""
