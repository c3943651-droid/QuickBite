<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickBite — Panel de Administración</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="QuickBite.AdminBlazor.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:Roboto, sans-serif; color:#ff6b00;">
            <h3>Cargando QuickBite Admin...</h3>
        </div>
    </div>

    <div id="blazor-error-ui">
        Se ha producido un error no controlado.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        window.quickbite = {
            downloadFile: function (fileName, content) {
                const blob = new Blob(["\ufeff" + content], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            },
            showSessionExpiredSnackbar: function () {
                const existing = document.getElementById('qb-session-snackbar');
                if (existing) existing.remove();
                const bar = document.createElement('div');
                bar.id = 'qb-session-snackbar';
                bar.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:12px 24px;border-radius:4px;font-family:Roboto,sans-serif;font-size:14px;z-index:9999;box-shadow:0 3px 5px rgba(0,0,0,0.3);transition:opacity 0.3s;';
                bar.textContent = 'Tu sesión ha expirado. Redirigiendo al inicio de sesión...';
                document.body.appendChild(bar);
                setTimeout(function () { if (bar.parentNode) bar.remove(); }, 4000);
            }
        };
    </script>
</body>

</html>
